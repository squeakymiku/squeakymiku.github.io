<!DOCTYPE html>
<html>
<head>
  <title>My IT Portfolio</title>
  <link rel="icon" type="image/gif" href="rainbowtoro.gif">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    html { overflow-y: scroll; }
    body {
      background-color: #000000;
      color: white;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      margin: 0;
      padding: 150px 150px 150px 150px;
    }

    /* Fixed Containers */
    .corner-info, .stamp-sidebar, .stamp-row { position: fixed; z-index: 100; }
    .corner-info { top: 20px; left: 20px; text-align: center; }
    .corner-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; display: block; margin: 0 auto 5px; }
    .corner-info span { font-size: 12px; font-weight: bold; }

    /* Button Style */
    .bio-button {
      display: inline-block;
      margin: 10px 0 20px 0;
      background: transparent;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.3s;
      text-shadow: 0 0 5px #00ffcc;
    }
    .bio-button:hover { background: #00ffcc; color: black; box-shadow: 0 0 15px #00ffcc; }

    /* Bio Overlay (Cyber-Goth Style) */
    .bio-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95); display: none;
      justify-content: center; align-items: center; z-index: 2000;
    }
    .bio-container {
      width: 90%; max-width: 800px; height: 500px;
      background: #0a0a0a;
      border: 2px solid #00ffcc; box-shadow: 0 0 20px #00ffcc;
      padding: 20px; position: relative;
    }
    .close-btn { 
      position: absolute; top: 10px; right: 10px; 
      background: none; border: none; color: #ff0055; 
      font-family: 'Orbitron'; cursor: pointer; font-size: 16px;
    }

    /* Grid Layout */
    .bio-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      height: 100%;
      overflow-y: auto;
      padding-top: 20px;
    }
    .bio-card {
      border: 1px solid #00ffcc;
      box-shadow: 0 0 8px #00ffcc;
      padding: 10px;
      text-align: left;
      transition: all 0.3s ease;
      color: #fff;
    }
    .bio-card:hover {
      background: rgba(0, 255, 204, 0.1);
      box-shadow: 0 0 20px #00ffcc;
    }
    .bio-card h3 {
      margin: 0 0 5px 0; color: #00ffcc; font-size: 14px;
      text-shadow: 0 0 5px #00ffcc;
    }
    .bio-card ul { font-size: 12px; margin: 0; padding-left: 20px; }

    /* Stamp/Layout Styles */
    .top-bar { top: 10px; left: 130px; right: 20px; display: flex; justify-content: center; gap: 10px; }
    .bottom-bar { bottom: 10px; left: 130px; right: 20px; display: flex; justify-content: center; gap: 10px; }
    .stamp-sidebar { top: 120px; bottom: 120px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; scrollbar-width: none; }
    .left-side { left: 15px; }
    .right-side { right: 15px; }
    img { width: 80px; height: auto; border: 1px solid white; transition: 0.2s; }
    img:hover { transform: scale(1.1); }
    h1 { font-size: 50px; text-shadow: 0 0 10px white; }
  </style>
</head>

<body>
  <div class="corner-info">
    <img src="https://github.com/squeakymiku.png">
    <span>Nohla ᗜˬᗜ</span>
  </div>

  <h1>Welcome to My Website</h1>
  <button class="bio-button" onclick="toggleBio()">ABOUT ME</button>
  
  <div id="myBio" class="bio-overlay">
    <div class="bio-container">
      <button class="close-btn" onclick="toggleBio()">[ X ]</button>
      <div class="bio-grid">
        <div class="bio-card"><h3>Github PFP</h3><p>Content goes here</p></div>
        <div class="bio-card"><h3>Games I'm Playing</h3><p>Games go here</p></div>
        <div class="bio-card"><h3>Summary</h3><p>Likes/Dislikes</p></div>
        <div class="bio-card"><h3>Animes I Watch</h3><p>Anime list</p></div>
        <div class="bio-card"><h3>Life</h3><p>School and fitness</p></div>
        <div class="bio-card"><h3>Stamps</h3><p>Gallery placeholder</p></div>
      </div>
    </div>
  </div>

  <script>
    function toggleBio() {
      var x = document.getElementById("myBio");
      x.style.display = (x.style.display === "flex") ? "none" : "flex";
    }
  </script>
</body>
</html>
