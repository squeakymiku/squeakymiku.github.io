<!DOCTYPE html>
<html>
<head>
  <title>My IT Portfolio</title>
  <link rel="icon" type="image/gif" href="rainbowtoro.gif">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    html { overflow-y: scroll; }
    body { background-color: #000000; color: white; font-family: 'Orbitron', sans-serif; text-align: center; margin: 0; padding: 150px 150px 150px 150px; }

    /* Animations */
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .floating-stamp { animation: float 4s ease-in-out infinite; display: inline-block; cursor: pointer; }

    /* Fixed Containers */
    .corner-info, .stamp-sidebar, .stamp-row { position: fixed; z-index: 100; }
    .corner-info { top: 20px; left: 20px; text-align: center; }
    .corner-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; display: block; margin: 0 auto 5px; }

    /* Button Style */
    .bio-button { display: inline-block; margin: 10px 0 20px 0; background: transparent; color: #00ffcc; border: 1px solid #00ffcc; font-family: 'Orbitron', sans-serif; padding: 8px 16px; cursor: pointer; }
    .bio-button:hover { background: #00ffcc; color: black; }

    /* Bio Dashboard Overlay */
    .bio-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); display: none; justify-content: center; align-items: center; z-index: 2000; }
    .bio-container { 
      width: 90%; max-width: 900px; height: 75vh; background: #0a0a0a; border: 2px solid #00ffcc; 
      padding: 20px; position: relative; display: grid; grid-template-columns: 250px 1fr; gap: 20px; text-align: left; overflow-y: auto;
    }
    .box { border: 1px solid #333; padding: 15px; margin-bottom: 10px; color: #ccc; }
    .close-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #ff0055; cursor: pointer; font-family: 'Orbitron'; }

    /* Existing Stamp Styles */
    .top-bar { top: 10px; left: 130px; right: 20px; display: flex; justify-content: center; gap: 10px; }
    .bottom-bar { bottom: 10px; left: 130px; right: 20px; display: flex; justify-content: center; gap: 10px; }
    .stamp-sidebar { top: 120px; bottom: 120px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; scrollbar-width: none; }
    .left-side { left: 15px; }
    .right-side { right: 15px; }
    img { width: 80px; height: auto; border: 1px solid white; }
    img:hover { transform: scale(1.1); }
  </style>
</head>

<body>
  <div class="corner-info">
    <img src="https://github.com/squeakymiku.png">
    <span>Nohla ᗜˬᗜ</span>
  </div>

  <h1>Welcome to My Website</h1>
  <button class="bio-button" onclick="toggleBio()">ABOUT ME</button>
  <p>Hi! I'm a high school student interested in IT, networking, and cybersecurity.</p>

  <div id="myBio" class="bio-overlay">
    <div class="bio-container">
      <button class="close-btn" onclick="toggleBio()">[ X ]</button>
      
      <div class="left-col">
        <div class="box"><img src="https://github.com/squeakymiku.png" style="width:100%"></div>
        <div class="box"><h3>Summary</h3><p>Talk about school, workouts, and life here!</p></div>
      </div>
      
      <div class="right-col">
        <div class="box"><h3>Games I'm Playing</h3><p>List your games...</p></div>
        <div class="box"><h3>Animes I Watch</h3><p>Current watchlist...</p></div>
        <div class="box"><h3>Stamps</h3>
           <img src="mikustamp.png" class="floating-stamp" style="animation-delay: 0s;">
           <img src="brat.png" class="floating-stamp" style="animation-delay: 1s;">
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleBio() {
      var x = document.getElementById("myBio");
      x.style.display = (x.style.display === "flex") ? "none" : "flex";
    }
  </script>
</body>
</html>
