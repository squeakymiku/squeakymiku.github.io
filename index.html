<!DOCTYPE html>
<html>
<head>
<title>My IT Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #000000;
    color: white;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    margin: 0;
    padding: 150px 150px 50px 150px; /* Big padding to keep content in the middle */
  }

  /* Main content container */
  .main-content {
    max-width: 800px;
    margin: 0 auto;
  }

  h1 { font-size: 50px; text-shadow: 0 0 10px white; }
  h2 { margin-top: 30px; text-shadow: 0 0 5px white; }
  p, li { font-size: 18px; }
  ul { list-style-position: inside; display: inline-block; text-align: left; }

  /* Corner Info - Pinned Top Left */
  .corner-info {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 200;
  }
  .corner-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; }
  .corner-info span { display: block; font-size: 10px; }

  /* Top Row - Pinned Top */
  .top-stamp-row {
    position: fixed;
    top: 10px;
    left: 100px; /* Start right of the avatar */
    right: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
    z-index: 150;
  }

  /* Sidebars - Pinned Sides */
  .stamp-sidebar {
    position: fixed;
    top: 100px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .left-side { left: 10px; }
  .right-side { right: 10px; }

  /* General Stamp Styling */
  img {
    width: 75px;
    height: auto;
    border: 1px solid white;
    transition: transform 0.2s;
  }
  img:hover { transform: scale(1.1); z-index: 300; }

</style>
</head>
<body>

  <div class="corner-info">
    <img src="https://github.com/squeakymiku.png" alt="Avatar">
    <span>Nohla ᗜˬᗜ</span>
  </div>

  <div class="top-stamp-row">
    <img src="nutella.gif">
    <img src="soda.gif">
    <img src="mikuMesmer.gif">
    <img src="tetoMesmer.gif">
  </div>

  <div class="stamp-sidebar left-side">
    <img src="a50.gif">
    <img src="a7.gif">
    <img src="brat.png">
    <img src="bunny6.gif">
    <img src="bunny8.png">
    <img src="cookierundance.gif">
    <img src="d5.jpg">
  </div>

  <div class="stamp-sidebar right-side">
    <img src="meanPeople.jpg">
    <img src="mikustamp.png">
    <img src="pcuser.webp">
    <img src="tumblr_4b02e5236e78e001d72a3175b5027934_d76773e6_100.gif">
    <img src="tumblr_7b82c4b656ad3e3093ab0aa161f69315_8eb4f7ea_100.png">
  </div>

  <div class="main-content">
    <h1>Welcome to My Website</h1>
    <p>Hi! I'm a high school student interested in IT, networking, and cybersecurity.</p>
    <h2>My Goals</h2>
    <p>I plan to study Information Technology in college.</p>
    <h2>Things I'm Learning</h2>
    <ul>
      <li>Windows troubleshooting</li>
      <li>Linux basics</li>
      <li>Networking fundamentals</li>
      <li>Cybersecurity concepts</li>
    </ul>
  </div>

</body>
</html>
